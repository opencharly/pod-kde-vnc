# kde-vnc.conf — sway drop-in (pod-sway includes ~/.config/sway/config.d/*).
#
# The nested KWin window carries NO app_id (measured: `app_id: null` in swaymsg -t
# get_tree); its title is "KDE Wayland Compositor WL-0 — Press right control key to grab
# pointer". Match the title, and make it the fullscreen, borderless content of the output.
for_window [title="^KDE Wayland Compositor"] fullscreen enable, border none
default_border none
gaps inner 0

# Plasma owns the keyboard: start sway in its passthrough mode (defined by pod-sway's
# config), so sway's own Alt bindings (Alt+Return, Alt+d, ...) never swallow keys meant
# for Plasma. Mod1+Pause leaves passthrough for sway administration.
exec_always swaymsg mode passthrough
