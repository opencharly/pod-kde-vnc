#  opencharly/pod-kde-vnc — a GPU pod that serves a fullscreen, hardware-accelerated KDE
#  Plasma desktop over VNC.
#
#  The stack, inside ONE container on the CDI pod base (opencharly/pod-cdi):
#
#    sway (headless, pod-sway)  ── serves wayland-0 ──►  wayvnc (pod-wayvnc) ── :5900
#        └─ KWin (nested, --socket wayland-kde) as sway's ONE fullscreen window
#              └─ plasmashell + KDE apps on wayland-kde
#
#  The GPU reaches the image from the HOST through CDI (pod-cdi composes layer-cdi and
#  never bakes a driver). sway renders on gles2 through it, and the nested KWin composites
#  with OpenGL ES through the same GPU — measured on an RTX 4080 SUPER (OpenGL ES 3.2
#  NVIDIA) and on an AMD radeonsi iGPU (OpenGL ES 3.2 Mesa) — never llvmpipe.
#
#  sway and wayvnc come from the Arch/CachyOS repositories, which ship the latest upstream
#  releases (sway 1.12, wayvnc 0.10.2); the box's checks assert those floors.

import:
    # A builder map does NOT cross a namespace boundary: a box composed here declares its
    # own (kdotool, via layer-kde-shell, is an AUR package). Same pin pod-cdi uses.
    # Both pins are import pins, not content: they exist to reach distro-arch's builder map
    # and pod-cdi's `pod-cdi` base. They must therefore stay new enough that the WHOLE
    # imported namespace LOADS under the charly binary the umbrella pins — a stale import
    # makes every project that imports this one unloadable (opencharly/pod-kde-vnc#3).
    # distro-arch must be >= v2026.324.0908 (distro-arch#74 nests `check-arch-vm`'s members
    # inside the bed's venue); v2026.326.1455 is the release where `aur` is a ROUTED BUILDER
    # rather than a box `build:` format (distro-arch#77, opencharly/sdk#608), so its
    # `arch-test` carries `build: [pac]` and the builder map this import exists for.
    # pod-cdi >= v2026.326.1530 is the release built on that same distro-arch generation, so
    # the direct and the transitive namespace agree.
    - arch: '@github.com/opencharly/distro-arch:v2026.326.1455'
    - podcdi: '@github.com/opencharly/pod-cdi:v2026.326.1530'

kde-vnc-session:
    candy:
        description: |
            A full KDE Plasma session nested in the pod's headless sway as one fullscreen,
            borderless window, so wayvnc's VNC stream shows Plasma.
            Composes the headless sway compositor (pod-sway), the VNC server (pod-wayvnc) and
            the nested Plasma session (pod-kde-nested -- the shared kde-nested service, its
            launcher and its kwin_wayland caps strip), pointing KWin at sway's wayland-0
            with its own wayland-kde socket, filling sway's output (sized by the single `RESOLUTION` knob). Installs a sway drop-in that
            fullscreens the KWin window and starts sway in passthrough mode so Plasma owns the
            keyboard. Sets the ambient session environment (`WAYLAND_DISPLAY=wayland-kde`,
            `KDE_SESSION_VERSION=6`) so any client launched inside joins the Plasma session with
            no restatement -- the compositor socket behind the fullscreen window is not it.
            Every claim is observable: the drop-in at build time, and at runtime the
            RUNNING session, the fullscreen KWin window in sway's tree, a hardware OpenGL
            renderer in KWin, a VNC frame of the desktop, the ambient session pair, and VNC
            keystrokes reaching a Plasma application.
        require:
            - '@github.com/opencharly/pod-sway:v2026.314.0718'
            - '@github.com/opencharly/pod-wayvnc:v2026.323.1735'
            # The nested Plasma session: one launcher for every nested KDE pod (R2).
            - '@github.com/opencharly/pod-kde-nested:v2026.326.2127'
            # plugin-vnc serves the `vnc:` check verb this candy authors.
            - '@github.com/opencharly/plugin-vnc/candy/plugin-vnc:v2026.314.0716'
        env:
            RESOLUTION: "1920x1080"
            # pod-kde-nested's knobs for this pod's socket layout: KWin nests in sway's
            # wayland-0 and serves wayland-kde (pod-sway's sway serves wayland-1 behind its
            # wayland-0 symlink, so a numbered KWin socket would collide).
            KDE_NESTED_HOST_DISPLAY: wayland-0
            KDE_NESTED_SOCKET: wayland-kde
            KDE_NESTED_RUNTIME_DIR: /tmp
            # NO KDE_NESTED_RESOLUTION: empty means KWin takes the size of the output it is
            # nested in, so ONE knob sizes both — the documented `RESOLUTION` below sets
            # sway's output and the nested session follows it. A second literal here would
            # let a consumer override `RESOLUTION` and get a sway output and a KWin window
            # of different sizes, with no way to fix it.
            KDE_NESTED_BUS: session
            # The AMBIENT session: what a client launched inside this pod (a `charly shell`
            # command, a check step, Chrome) should join WITHOUT restating anything. pod-sway's
            # candy sets WAYLAND_DISPLAY=wayland-0 for its own clients, but that socket is the
            # compositor BEHIND the fullscreen Plasma window — a window there is invisible. So
            # the pod overrides it to the session users actually see, and adds the session
            # version every KDE client (and kdotool) expects. sway and wayvnc keep their own
            # service-level WAYLAND_DISPLAY=wayland-0 (a service must not depend on ambient
            # drift), and kde-nested uses the KDE_NESTED_* knobs above — so nothing that needs
            # the compositor socket moves.
            WAYLAND_DISPLAY: wayland-kde
            KDE_SESSION_VERSION: "6"
        env_accept:
            - name: RESOLUTION
              description: "WxH of the sway output, and so of the nested Plasma session that fills it. Default: 1920x1080"
        plan:
            - run: mkdir=${HOME}/.config/sway/config.d
              mkdir: "${HOME}/.config/sway/config.d"
              run_as: "${USER}"
            - run: copy=kde-vnc.conf
              copy: kde-vnc.conf
              to: "${HOME}/.config/sway/config.d/kde-vnc.conf"
              mode: "0644"
              run_as: "${USER}"
            - check: the sway drop-in fullscreens the nested KWin window by its title and starts passthrough mode
              file:
                file: ${HOME}/.config/sway/config.d/kde-vnc.conf
                contains:
                    - contains: 'for_window [title="^KDE Wayland Compositor"] fullscreen enable'
                    - contains: "exec_always swaymsg mode passthrough"

kde-vnc:
    candy:
        description: |
            The pod-kde-vnc image: a fullscreen, GPU-accelerated KDE Plasma desktop served over
            VNC on :5900, built on the CDI GPU pod base (opencharly/pod-cdi), so the GPU driver
            comes from the host and none is baked in.
        base: podcdi.pod-cdi
        platform:
            - linux/amd64
        build:
            - pac
        builder:
            aur: arch.arch-builder
            cargo: arch.arch-builder
            npm: arch.arch-builder
            pixi: arch.arch-builder
        candy:
            - kde-vnc-session
        plan:
            - check: sway is at least 1.12, the latest upstream release
              id: kde-vnc-sway-version
              exit_status: 0
              stdout:
                  - matches: "^sway version 1\\.(1[2-9]|[2-9][0-9])"
              command: sway --version
            - check: wayvnc is at least 0.10.2, the latest upstream release
              id: kde-vnc-wayvnc-version
              exit_status: 0
              stdout:
                  - matches: "^wayvnc 0\\.(10\\.([2-9]|[1-9][0-9])|1[1-9]\\.)"
              command: pacman -Q wayvnc
            - check: no host-side nvidia-ctk is baked into the image (the CDI pod contract)
              id: kde-vnc-no-nvidia-ctk
              exit_status: 0
              command: "! command -v nvidia-ctk"

# Disposable R10 bed for the pod: builds kde-vnc, deploys it, and proves the whole chain —
# sway serves, KWin is nested fullscreen, KWin renders on the GPU, wayvnc streams the
# desktop, and VNC keystrokes reach a Plasma application.
check-kde-vnc-pod:
    pod:
        image: kde-vnc
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that pod-kde-vnc serves a fullscreen, hardware-accelerated KDE Plasma
            desktop over VNC: the sway, wayvnc and Plasma services run; the nested KWin window
            is fullscreen in sway; KWin composites with OpenGL on the GPU (not llvmpipe);
            wayvnc streams a 1920x1080 frame; and VNC key events typed into a Konsole run a
            command inside the pod.
        plan:
            - check: sway, wayvnc and the nested Plasma session are all RUNNING under supervisord
              id: bed-services
              context: [runtime]
              eventually: 60s
              retry_interval: 3s
              exit_status: 0
              stdout:
                  - equals: RUNNING
              command:
                command: supervisorctl status sway wayvnc kde-nested | awk '{print $2}' | sort -u
                in_container: true
            - check: the nested KWin window is fullscreen in sway
              id: bed-kwin-fullscreen
              context: [runtime]
              eventually: 60s
              retry_interval: 3s
              exit_status: 0
              stdout:
                  - contains: '"fullscreen_mode": 1'
              command:
                command: |
                  SWAYSOCK=$(ls -t /tmp/sway-ipc.*.sock | head -1) swaymsg -t get_tree \
                    | grep -A40 '"name": "KDE Wayland Compositor' | grep -m1 '"fullscreen_mode"'
                in_container: true
            - check: KWin composites with hardware OpenGL, not the llvmpipe software rasterizer
              id: bed-kwin-gpu
              context: [runtime]
              eventually: 60s
              retry_interval: 3s
              exit_status: 0
              stdout:
                  - contains: "Compositing Type: OpenGL"
                  - matches: "OpenGL renderer string: (NVIDIA|AMD|Intel|Radeon)"
                  - not_contains: llvmpipe
              command:
                command: qdbus6 org.kde.KWin /KWin supportInformation | grep -E 'Compositing Type|OpenGL renderer string'
                in_container: true
            - check: the VNC server answers on the published port
              id: bed-vnc-status
              context: [runtime]
              eventually: 60s
              retry_interval: 3s
              vnc: status
              stdout:
                  - contains: "1920x1080"
            - check: the VNC framebuffer is a full, non-uniform frame of the desktop
              id: bed-vnc-frame
              context: [runtime]
              vnc:
                method: screenshot
                artifact: /tmp/check-kde-vnc-pod-frame.png
                artifact_min_dimensions: 1920x1080
                artifact_not_uniform: true
            - check: before any VNC input, the marker the typed command creates does not exist
              id: bed-vnc-input-absent
              context: [runtime]
              file:
                file: /tmp/kde-vnc-input-ok
                exists: false
            # The input sequence is authored as the bed's own `check:` steps: a bed's
            # `run:` steps are verify-only in its check-live stage (skipped), so a
            # mutation the bed needs must live in a check step (/charly-check:check).
            - check: a Konsole is launched inside the Plasma session
              id: bed-open-konsole
              context: [runtime]
              # The display is named, not inherited: a check step's command environment carries the
              # OPERATOR's WAYLAND_DISPLAY (measured — a runner on a Wayland desktop leaks its own
              # value into the container), so a client that must land in Plasma says so.
              command:
                command: |
                  WAYLAND_DISPLAY=wayland-kde XDG_RUNTIME_DIR=/tmp setsid konsole >/dev/null 2>&1 < /dev/null &
                  echo launched
                in_container: true
              exit_status: 0
            # The sync primitive for "keystrokes will reach Konsole": KWin itself reports
            # Konsole as its ACTIVE window (kdotool, over KWin's D-Bus scripting), polled
            # under a bounded window — no fixed delay.
            - check: KWin reports the Konsole as its active window, so VNC keystrokes reach it
              id: bed-konsole-focused
              context: [runtime]
              eventually: 60s
              retry_interval: 2s
              exit_status: 0
              stdout:
                  - contains: Konsole
              command:
                command: KDE_SESSION_VERSION=6 kdotool getactivewindow getwindowname
                in_container: true
            - check: a command is typed into the Konsole through VNC key events
              id: bed-vnc-type
              context: [runtime]
              vnc:
                method: type
                text: touch /tmp/kde-vnc-input-ok
            - check: Return is pressed through VNC
              id: bed-vnc-return
              context: [runtime]
              vnc:
                method: key
                key: Return
            - check: the command typed over VNC ran inside the pod (VNC -> sway -> KWin -> Konsole)
              id: bed-vnc-input-reached-plasma
              context: [runtime]
              eventually: 30s
              retry_interval: 2s
              file:
                file: /tmp/kde-vnc-input-ok
                exists: true
            - agent-check: the VNC frame shows a fullscreen KDE Plasma desktop (panel and wallpaper) with no sway border or gaps, not a black or gray frame

kde-vnc-skill:
    skill:
        name: kde-vnc
        family: selkies
        owner: kde-vnc-session
        description: |-
            The pod-kde-vnc GPU pod: a fullscreen, hardware-accelerated KDE Plasma session nested in headless sway and served over wayvnc on :5900, on the CDI pod base.
            MUST be invoked before building, deploying, configuring or troubleshooting the kde-vnc image, its kde-vnc-session candy, or the check-kde-vnc-pod bed.
